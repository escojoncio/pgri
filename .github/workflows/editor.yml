name: editor
on:
  push:
    paths: ['editor/**', '.github/workflows/editor.yml']
  workflow_dispatch:
jobs:
  exe-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r editor/requirements-dev.txt
      - name: Tests (los que necesitan tools/py o el juego se saltan)
        run: python -m pytest editor/tests -q
      - name: PyInstaller (onedir, sin autoextraccion en cada arranque)
        working-directory: editor
        run: >
          pyinstaller --noconfirm --onedir --noupx --windowed --name GridaniaEditor
          --paths . --add-data "gridania_editor/ui;gridania_editor/ui"
          --collect-submodules gridania_editor
          --hidden-import gridania_editor.stdlib_para_scripts
          run_editor.py
      - name: Empaquetar zip
        shell: pwsh
        working-directory: editor
        run: Compress-Archive -Path dist/GridaniaEditor -DestinationPath dist/GridaniaEditor-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GridaniaEditor-win64
          path: editor/dist/GridaniaEditor-win64.zip
